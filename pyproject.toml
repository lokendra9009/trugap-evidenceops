[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trugap-evidenceops"
version = "0.1.0"
description = "Local-first SOC 2 engineering evidence scanner for SaaS repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "TruGap" },
]
dependencies = [
  "jinja2>=3.1.4",
  "pydantic>=2.8.0",
  "rich>=13.7.1",
  "typer>=0.12.3",
]

[project.scripts]
trugap = "trugap_evidenceops.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
